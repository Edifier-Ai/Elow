<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elow Admin</title>
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Elow Admin</h1>
          <p>Local catalog, goals, and intake data</p>
        </div>
        <button id="refreshButton" type="button">Refresh</button>
      </header>

      <section class="section">
        <div class="sectionHeader">
          <h2>Catalog Configuration</h2>
          <span id="saveStatus"></span>
        </div>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Family</th>
                <th>Serving</th>
                <th>Sugar g</th>
                <th>Alcohol g</th>
                <th>Calories</th>
                <th>Money</th>
                <th>Image URL</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="catalogRows"></tbody>
          </table>
        </div>
      </section>

      <section class="grid">
        <section class="section">
          <h2>Users</h2>
          <div id="userRows" class="list"></div>
        </section>

        <section class="section">
          <h2>Recent Records</h2>
          <div id="recordRows" class="list"></div>
        </section>
      </section>
    </main>

    <script src="/admin/app.js"></script>
  </body>
</html>
